{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}New finding{% endblock %}
{% block content %}
<div><h1>New finding</h1><p class="sub">Saved as a Draft first. You choose a Reviewer when you submit it.</p></div>
<form method="post" class="cd pd" style="max-width:820px" data-validate>
  {{ csrf() }}
  {% set f = form %}
  {% include "_finding_fields.html" %}
  <div class="mt-3 d-flex gap-2">
    <button class="btn btn-primary" type="submit">Save draft</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('main.findings') }}">Cancel</a></div>
</form>
{% endblock %}
