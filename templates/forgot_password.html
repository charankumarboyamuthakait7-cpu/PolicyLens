
{% extends "base.html" %}

{% block title %}Forgot Password | PolicyLens{% endblock %}

{% block public %}
<div class="container d-flex justify-content-center align-items-center"
     style="min-height: 75vh;">

    <div class="card shadow-sm border-0"
         style="width: 100%; max-width: 460px; border-radius: 18px;">

        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <div class="mb-3">
                    <i class="bi bi-shield-lock"
                       style="font-size: 42px; color: #4F6BFF;"></i>
                </div>

                <h3 class="fw-bold mb-2">Forgot Password?</h3>

                <p class="text-muted mb-0">
                    Enter your registered email address and we'll send you
                    a verification code to reset your password.
                </p>
            </div>

            <form method="POST">
                {{ csrf() }}

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">
                        Email Address
                    </label>

                    <input type="email"
                           class="form-control"
                           id="email"
                           name="email"
                           placeholder="Enter your registered email"
                           autocomplete="email"
                           required>
                </div>

                <button type="submit"
                        class="btn btn-primary w-100 py-2 fw-semibold">
                    Send Verification Code
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="{{ url_for('main.login') }}"
                   class="text-decoration-none small">
                    <i class="bi bi-arrow-left me-1"></i>
                    Back to Login
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
