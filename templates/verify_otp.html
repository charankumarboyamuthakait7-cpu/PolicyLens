
{% extends "base.html" %}

{% block title %}Verify OTP | PolicyLens{% endblock %}

{% block public %}
<div class="container d-flex justify-content-center align-items-center"
     style="min-height: 75vh;">

    <div class="card shadow-sm border-0"
         style="width: 100%; max-width: 460px; border-radius: 18px;">

        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">

                <div class="mb-3">
                    <i class="bi bi-envelope-check"
                       style="font-size: 42px; color: #4F6BFF;"></i>
                </div>

                <h3 class="fw-bold mb-2">Verify Your Email</h3>

                <p class="text-muted">
                    Enter the 6-digit verification code sent to
                    <strong>{{ email }}</strong>.
                </p>

            </div>

            <form method="POST">
                  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                {{ csrf_token() }}

                <div class="mb-3">
                    <label for="otp" class="form-label fw-semibold">
                        Verification Code
                    </label>

                    <input type="text"
                           class="form-control text-center fw-bold"
                           id="otp"
                           name="otp"
                           placeholder="Enter 6-digit OTP"
                           maxlength="6"
                           inputmode="numeric"
                           autocomplete="one-time-code"
                           pattern="[0-9]{6}"
                           required
                           style="letter-spacing: 8px; font-size: 22px;">
                </div>

                <button type="submit"
                        class="btn btn-primary w-100 py-2 fw-semibold">
                    Verify Code
                </button>

            </form>

            <div class="text-center mt-4">
                <a href="{{ url_for('main.forgot_password') }}"
                   class="text-decoration-none small">
                    <i class="bi bi-arrow-left me-1"></i>
                    Change Email / Request New Code
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
